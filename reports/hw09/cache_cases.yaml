     why: "same wording as S4, other recall number: Morning Dew Creamy Peanut Butter, not cheddar crackers"}
  - {id: M05, kind: similar, seed: S5, expect: miss, query: "What is the recall category of F-1867-2026?",
     why: "same wording as S5, other recall number: Bacterial Contamination, not Undeclared Allergen"}
  - {id: M06, kind: similar, seed: S6, expect: miss, query: "In which state is the firm for recall F-2320-2026 located?",
     why: "same wording as S6, other recall number: IA, not GA"}
  - {id: M07, kind: similar, seed: S7, expect: miss, query: "What should a consumer do if they bought peanut butter that may contain undeclared milk?",
     why: "consumer instead of store: stop eating / return it, not pull stock from shelves"}
  - {id: M08, kind: similar, seed: S8, expect: miss, query: "How should a grocery store hold recalled products until the supplier collects them?",
     why: "keep and segregate for pickup, the opposite of disposing of them"}
  - {id: M09, kind: similar, seed: S9, expect: miss, query: "How should a store get reimbursed by the supplier for recalled items it removed?",
     why: "store-to-supplier credit, not store-to-customer refund"}
  - {id: M10, kind: similar, seed: S10, expect: miss, query: "How should a food company notify the FDA about a product recall?",
     why: "firm reporting to the regulator, not a store informing shoppers"}

  # ===== unrelated (10) - nothing in the cache applies, expect miss ==============
