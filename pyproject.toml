# DATA 260 - shared tool settings (HW7 Part 1-V: Ruff linting)

[tool.ruff]
target-version = "py312"
line-length = 100
# Evidence folders and the React app are not Python application code.
extend-exclude = ["frontend", "reports", "postman"]

[tool.ruff.lint]
# Ruff's default rule set, written out so the report can name it:
#   F  = Pyflakes (unused imports/variables, undefined names, f-strings without placeholders)
#   E4/E7/E9 = pycodestyle errors (imports, statements, syntax)
select = ["E4", "E7", "E9", "F"]
