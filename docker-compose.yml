# DATA 260 - HW8: Kafka broker for the request/response service and the agent pipeline.
# One broker in KRaft mode (no ZooKeeper).
# Two listeners:
#   kafka:29092     - used by other containers on the compose network (worker, API)
#   localhost:9092  - used by scripts on the Mac (homework_demo.py, planner.py, ...)

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: s9275-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly (Part 2 needs 2 partitions on s9275_tasks),
      # so a typo in a topic name fails loudly instead of creating a new topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # One-shot job: create every HW8 topic, then exit. Kafka keeps its data inside
  # the container, so any time the kafka container is recreated the topics are
  # gone; this job puts them back before the worker and API start.
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: s9275-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        B=kafka:29092
        for t in recall_notice_requests recall_notice_responses inbox drafts final dead_letter; do
          $$T --create --if-not-exists --topic s9275_$$t --partitions 1 --replication-factor 1 --bootstrap-server $$B
        done
        $$T --create --if-not-exists --topic s9275_tasks --partitions 2 --replication-factor 1 --bootstrap-server $$B
        $$T --describe --bootstrap-server $$B | grep -E "^Topic"

  # Part 1 worker: consumes s9275_recall_notice_requests, keeps entities in a dict.
  worker:
    build: ./code/kafka_app
    image: s9275-kafka-app
    container_name: s9275-worker
    command: ["python", "worker.py"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure

  # Part 1 FastAPI wrapper on PORT_BASE 8275 (only reachable from this Mac).
  api:
    build: ./code/kafka_app
    image: s9275-kafka-app
    container_name: s9275-api
    command: ["python", "api.py"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      BIND_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8275:8275"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      worker:
        condition: service_started
    restart: on-failure
